[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circuitinsight"
version = "0.5.1"
description = "Symbolic small-signal circuit analyzer driven by simulator operating-point data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arcadie Cracan", email = "arcadie.cracan@academic.tuiasi.ro" }]
keywords = [
    "symbolic circuit analysis",
    "analog",
    "small-signal",
    "operating point",
    "SPICE",
    "EDA",
    "Cadence Spectre",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = ["sympy>=1.12", "numpy>=1.26", "gmpy2>=2.1",
                "python-flint>=0.6"]

[project.optional-dependencies]
# PyYAML is a TEST dependency: an unparseable workflow file
# disables CI silently, so the guard that catches it has to be
# able to run in the gate venv too
dev = ["pytest", "jsonschema", "PyYAML"]
gui = ["PySide6>=6.6", "matplotlib>=3.7"]
notebook = ["ipywidgets>=8", "matplotlib>=3.7"]

[project.scripts]
circuitinsight-gui = "circuitinsight.gui.launch:main"
circuitinsight-skill-path = "circuitinsight.skill:_main"

[project.urls]
Homepage = "https://github.com/arcadie-cracan/CircuitInsight"
Repository = "https://github.com/arcadie-cracan/CircuitInsight"
Issues = "https://github.com/arcadie-cracan/CircuitInsight/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/circuitinsight"]
# the symbols submodule rides inside the package; its git plumbing and
# any local editing backups stay out of the wheel
exclude = ["src/circuitinsight/symbols/.git*",
           "src/circuitinsight/symbols/backup-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
extend-exclude = ["src/circuitinsight/symbols"]   # a separate repo

[tool.ruff.lint]
# The gate is REAL errors only -- undefined names, unused imports and
# locals, syntax. Style is not policed here: this codebase carries
# deliberate long comment blocks, and a formatter war would bury the
# findings that matter.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# theme.py injects its palette names with globals().update(pal), so
# every colour reads as undefined to a static pass. The pattern is
# deliberate and predates this gate.
"src/circuitinsight/gui/theme.py" = ["F821"]
# a string return annotation under `from __future__ import
# annotations`: never evaluated, and numpy is imported in the body
"src/circuitinsight/analyzer.py" = ["F821"]
