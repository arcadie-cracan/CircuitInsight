<!doctype html>
<!-- KaTeX expression shell for the CircuitInsight GUI (loaded by ExprWebView).

     Python pushes {lines, values} via window.renderExpr(); every device symbol
     arrives tagged with its raw join-key name (\htmlData -> data-sym), so
     hover shows its operating-point value and a click round-trips to Python
     over the QWebChannel `bridge` object. Assets are local (katex/ next to
     this file) -- no network. Also opens standalone in a browser for
     debugging (the bridge guard just no-ops). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  body{font-family:system-ui,"Segoe UI",sans-serif;margin:0;
       background:#f2f2f2;color:#1a1a1a}
  #expr{padding:10px 14px}
  .line{padding:6px 2px;font-size:18px;overflow-x:auto}
  .katex{font-size:1.12em}
  [data-sym]{cursor:pointer;border-radius:3px}
  [data-sym].hov{background:#cfe3ff}
  [data-sym].pin{background:#ffe08a;outline:1px solid #d8ae38}
  [data-num]{cursor:help;border-radius:3px}
  [data-num].hov{background:#f3e2bd}
  /* KaTeX stacks fraction/script rows with full-width ~3em strut boxes that
     cover the denominator, swallowing hits (only glyph edges responded). Let
     hits pass through the row boxes; their real content stays hittable. */
  .katex .vlist > span{pointer-events:none}
  .katex .vlist > span > *{pointer-events:auto}
  #tip{position:fixed;pointer-events:none;background:#222;color:#fff;
       font-size:12px;padding:4px 8px;border-radius:4px;opacity:0;
       transition:opacity .08s;z-index:9;white-space:nowrap;
       box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #tip b{color:#8fd0ff}
</style>
</head>
<body>
<div id="expr"></div>
<div id="tip"></div>
<script>
"use strict";
let VALUES = {};
let NUMERALS = {};
let NUMHINT = "";
let bridge = null;
if (typeof QWebChannel !== "undefined" && typeof qt !== "undefined"
    && qt.webChannelTransport) {
  new QWebChannel(qt.webChannelTransport,
                  ch => { bridge = ch.objects.bridge || null; });
}

window.renderExpr = function (payload) {
  VALUES = payload.values || {};
  NUMERALS = payload.numerals || {};
  NUMHINT = payload.numhint || "";
  const host = document.getElementById("expr");
  host.textContent = "";
  for (const l of payload.lines || []) {
    const d = document.createElement("div");
    d.className = "line";
    try {
      katex.render(l, d, {displayMode: true, trust: true, strict: false});
    } catch (e) {
      d.textContent = l;                     // never blank the panel on bad TeX
    }
    host.appendChild(d);
  }
};

/* delegated events survive re-renders.

   Hit-test the WHOLE stack under the cursor, not e.target: even with the
   pointer-events relief above, a covered glyph's hit can land on an overlay
   (KaTeX vlist geometry), and elementsFromPoint sees through the pile. */
function symAt(x, y) {
  for (const el of document.elementsFromPoint(x, y)) {
    const hit = el.closest ? el.closest("[data-sym]") : null;
    if (hit) return hit;
  }
  return null;
}
/* numerals: collapsed operating-point products. Hover explains them --
   from the Explain-the-numbers stories when computed, else a prompt. */
function numAt(x, y) {
  for (const el of document.elementsFromPoint(x, y)) {
    const hit = el.closest ? el.closest("[data-num]") : null;
    if (hit) return hit;
  }
  return null;
}
const tip = document.getElementById("tip");
let hov = null;
document.addEventListener("mousemove", e => {
  const el = symAt(e.clientX, e.clientY) || numAt(e.clientX, e.clientY);
  if (hov && hov !== el) hov.classList.remove("hov");
  hov = el;
  if (!el) { tip.style.opacity = 0; return; }
  el.classList.add("hov");
  if (el.dataset.sym !== undefined) {
    const n = el.dataset.sym;
    tip.innerHTML = "<b>" + n + "</b> = " + (VALUES[n] ?? "?");
  } else {
    /* finest tag first (part:k:monomial, from the per-numeral pass);
       fall back to the coefficient-level tip with a nudge toward the
       deep pass; then the run-the-analysis prompt. */
    const tag = el.dataset.num;
    let t = NUMERALS[tag];
    if (t === undefined) {
      const parts = tag.split(":");
      if (parts.length === 3) {
        const coarse = NUMERALS[parts[0] + ":" + parts[1]];
        if (coarse !== undefined)
          t = coarse + "<br><i>this numeral's own split: run Analysis "
            + "→ Explain per numeral</i>";
      }
    }
    tip.innerHTML = t ?? NUMHINT;
  }
  tip.style.opacity = 1;
  tip.style.left = (e.clientX + 12) + "px";
  tip.style.top = (e.clientY + 14) + "px";
});
document.addEventListener("mouseleave", () => {
  if (hov) hov.classList.remove("hov");
  hov = null;
  tip.style.opacity = 0;
});
/* Selection semantics follow the convention every file manager and schematic
   editor uses, because a plain click that ACCUMULATED left the expression
   progressively covered in highlights with no way back except reloading:

     click            select only this symbol (clear the rest)
     ctrl/cmd click   add or remove this one, keep the others
     click on nothing clear the selection

   Every occurrence of a symbol pins together -- they are one quantity, so
   seeing g_m,MN1 light up in both numerator and denominator is the point. */
function pinnedSyms() {
  return [...new Set([...document.querySelectorAll("[data-sym].pin")]
      .map(x => x.dataset.sym))];
}
function setPin(name, on) {
  document.querySelectorAll('[data-sym="' + CSS.escape(name) + '"]')
      .forEach(x => x.classList.toggle("pin", on));
}
function clearPins() {
  document.querySelectorAll("[data-sym].pin")
      .forEach(x => x.classList.remove("pin"));
}
document.addEventListener("click", e => {
  const el = symAt(e.clientX, e.clientY);
  const additive = e.ctrlKey || e.metaKey;
  if (!el) {                       // clicking blank space clears
    if (!additive) {
      clearPins();
      if (bridge && bridge.on_selection_change) bridge.on_selection_change("");
    }
    return;
  }
  const n = el.dataset.sym;
  if (additive) {
    setPin(n, !el.classList.contains("pin"));
  } else {
    clearPins();
    setPin(n, true);
  }
  if (bridge && bridge.on_symbol_click) bridge.on_symbol_click(n);
  // the whole set, so the schematic selection mirrors what is lit up here
  if (bridge && bridge.on_selection_change)
    bridge.on_selection_change(pinnedSyms().join(","));
});
</script>
</body>
</html>
