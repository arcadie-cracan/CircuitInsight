name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          # the symbols submodule is public; with it checked
          # out the schematic tests RUN instead of skipping
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libs (PySide6 needs these headless on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install
        # [gui] too, so the GUI/view tests actually run instead of skipping.
        # If PySide6 still cannot load, its importorskip guard skips those tests
        # rather than failing the job.
        run: python -m pip install -e .[dev,gui]
      # QUOTED: a plain YAML scalar cannot contain a colon-space, and
      # an unquoted "only: undefined" here made the whole workflow
      # unparseable -- which does not merely skip the lint, it stops
      # EVERY job from running. Guarded by tests/test_workflows.py.
      - name: "Lint (real errors only: undefined names, unused imports)"
        run: |
          python -m pip install ruff
          python -m ruff check .
      - name: Run test suite (no EDA licenses needed — checked-in fixtures)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
